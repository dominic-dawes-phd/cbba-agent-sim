# Dev figures for one generated house (needs the [solver] extra for the oracle):
# python -m experiments.dev_refresh configs/dev/house_48x32_s0.yaml.
env: house_48x32_s0
episodes:
  - configs/generated/house_48x32_s0/episode_oracle.yaml
  - configs/generated/house_48x32_s0/episode_greedy.yaml
  - configs/generated/house_48x32_s0/episode_scripted.yaml
first_seed: 0
seeds: 2
loss_levels: [0.3, 0.6]
