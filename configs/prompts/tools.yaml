# One line per tool, shown to the LLM executor. Which tools a condition offers is set in code
# (llm/prompts.py), so no condition sees a tool it may not use (docs/design/conditions.md).
move_to: "move_to(object): walk next to an object you know of. Do this before acting on it."
explore: "explore() takes no arguments: walk toward floor nobody on your team has searched; stops when you see something new."
search: "search() takes no arguments: walk toward floor you have not seen yourself, to find an object you need."
pick: "pick(item): pick up an item next to you."
place: "place(item, target): put an item you hold on or in furniture next to you; a slot such as cabinet_1[2] is allowed."
open: "open(furniture): open a container next to you."
close: "close(furniture): close a container next to you."
start: "start(appliance): start a closed dishwasher next to you; the wash runs on its own."
lock: "lock(furniture): reserve the workspace around furniture so teammates keep off it."
unlock: "unlock(furniture): release a workspace you reserved."
tie_bag: "tie_bag(trashcan): tie the trash in an open trashcan next to you into one bag you can carry."
scan: "scan(object): read an object's hidden attributes (needs a scanner)."
wait: "wait(ticks): do nothing for a whole number of ticks, for example wait(10). Use it when you have nothing to do."
report: "report(task): tell the team a task is finished. Only when its goal really holds."
release: "release(task): tell the team you are giving a task up so someone else can take it."
mark_done: "mark_done(task): record in the team ledger that your task is finished. Only when its goal really holds."
give_up: "give_up(task): record in the team ledger that you are giving your task up, so it is auctioned again."
talk_to_team: "talk_to_team(): ask your teammates for a new round of planning, when you finished your task or cannot continue."
