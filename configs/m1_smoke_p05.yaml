# M1 smoke run with a degraded channel: base loss p = 0.5 plus distance and wall falloff.
name: m1_smoke_p05
seed: 0
max_ticks: 500
map: configs/maps/kitchen_small.txt
mission: configs/missions/smoke.yaml
output_dir: runs
snapshot_every: 10

latency:
  prefill_rate: 2000.0
  decode_rate: 40.0
  seconds_per_tick: 1.0

channel:
  base_loss: 0.5
  comm_range: null
  d0: 10.0
  alpha: 4.0
  wall_penalty: 0.8
  latency_ticks: 0

churn:
  num_agents: 0
  rejoin_delay: 30
  earliest_tick: 10
  latest_tick: 60

scripted:
  wait_ticks: 5
