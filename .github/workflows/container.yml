# Builds the cluster runtime image (Dockerfile) and pushes it to GitHub Container Registry as
# ghcr.io/<owner>/cbba-agent-sim:<llama.cpp build> and :latest (docs/design/cluster.md).
# Runs when the Dockerfile or this workflow changes on main, or by hand (Actions tab).
name: container

on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/container.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name and llama.cpp build tag
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build=$(sed -n 's/^ARG LLAMA_TAG=server-cuda-//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.build }}
            ${{ steps.names.outputs.image }}:latest
