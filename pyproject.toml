[project]
name = "cbba-agent-sim"
version = "5.4.0"
description = "Simulator for leaderless semantic allocation with LLM-driven robot teams (CMSC 601)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Paper figures only (experiments/plot.py); the sim and tests never import it.
analysis = [
    "matplotlib>=3.8",
]
# The oracle's proven bound (allocation/oracle_cpsat.py); the sim and the heuristic never import it.
solver = [
    "ortools>=9.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sim", "llm", "allocation", "experiments"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
